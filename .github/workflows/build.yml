name: CI - Python version
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Prepare
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: '5.12.x'
      - uses: gittools/actions/gitversion/execute@v0.10.2
        id: gitversion

      # Build
      - name: Inject version number
        run: |
          sed -i "s/^version = '.*'$/version = '${{steps.gitversion.outputs.legacySemVer}}'/" zeroinstall/__init__.py
          sed -i "s/^version = '.*'$/version = '${{steps.gitversion.outputs.legacySemVer}}'/" zeroinstall/0launch-gui/gui.py
      - name: make translations
        run: |
          sudo apt-get -qq install gettext
          make translations
      - name: 0template
        run: ./0install run https://apps.0install.net/0install/0template.xml 0install-python.xml.template version=${{steps.gitversion.outputs.legacySemVer}}
      - name: 0test
        run: ./0install run https://apps.0install.net/0install/0test.xml 0install-python-${{steps.gitversion.outputs.legacySemVer}}.xml

      # Release
      - name: Get tag message
        if: github.ref_type == 'tag'
        id: tag_message
        run: |
          {
            echo "message<<EOF"
            git fetch -f origin tag ${{github.ref_name}}
            git tag -l ${{github.ref_name}} --format="%(contents)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body: |
            This version is mainly intended for use as a library dependency in Python-based 0install tools.
            ## Changes
            ${{steps.tag_message.outputs.message}}
          files: |
            0install-${{steps.gitversion.outputs.legacySemVer}}.xml
            0install-${{steps.gitversion.outputs.legacySemVer}}.tar.bz2

      # Publish
      - name: Publish feed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{secrets.PERSONAL_TOKEN}}
        run: >
          gh workflow run --repo=0install/apps Incoming
          -f feed_url=https://github.com/${{github.repository}}/releases/download/${{github.ref_name}}/0install-${{steps.gitversion.outputs.legacySemVer}}.xml
          -f archive_url=https://github.com/${{github.repository}}/releases/download/${{github.ref_name}}/0install-${{steps.gitversion.outputs.legacySemVer}}.tar.bz2
